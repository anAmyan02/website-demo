<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <script src="https://cdn.tailwindcss.com"></script>

  </head>
    
  <body>
  <script src="https://cdn.tailwindcss.com"></script>

<div class="flex flex-col md:flex-row min-h-screen bg-gray-50 text-gray-800">

  <aside class="w-full md:w-64 bg-white text-slate-700 flex flex-col border-r border-gray-200 shadow-sm">
    <div class="p-6 border-b border-gray-100 flex items-center gap-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white font-bold w-9 h-9 flex items-center justify-center shadow-md shadow-blue-200">
        N
      </div>
      <span class="text-xl font-bold text-slate-900 tracking-tight">Notif Management</span>
    </div>

    <nav class="flex-1 p-4 space-y-1">
      
      <a href="#" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-gray-50 hover:text-slate-900 transition-all text-sm font-medium">
        Վիճակագրություն
      </a>
      
      <a href="#" class="flex items-center px-3 py-2.5 rounded-lg bg-blue-50 text-blue-600 text-sm font-semibold border-l-4 border-blue-600 pl-2">
        Ծանուցումներ
      </a>
    </nav>

    <div class="p-4 border-t border-gray-100 bg-gray-50/50 flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
        ԱՊ
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-slate-800 truncate">Պողոս Պ.</p>
        <p class="text-[10px] text-gray-400 truncate">Ադմինիստրատոր</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 p-6 md:p-10 space-y-8 overflow-y-auto">
    
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-200 pb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Ծանուցումների կառավարում</h1>
        <p class="text-sm text-gray-500">Ուղարկեք հաղորդագրություններ թիրախավորված խմբերին</p>
      </div>
    </header>

    <section class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Ակտիվ</p>
        <div class="flex items-end gap-2 mt-2">
          <span class="text-3xl font-black text-slate-800">24</span>
          <span class="text-green-500 text-xs font-bold mb-1">↑ 12%</span>
        </div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Սևագրեր</p>
        <h3 class="text-3xl font-black text-slate-800 mt-2">5</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Կասեցված</p>
        <h3 class="text-3xl font-black text-slate-800 mt-2 text-red-500">1</h3>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
        <span class="w-2 h-6 bg-blue-600 rounded-full"></span> Նոր Ծանուցում
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        
        <div class="space-y-2">
          <label class="text-xs font-bold text-gray-500 uppercase">Տարիքային միջակայք</label>
          <div class="flex items-center gap-2">
            <input type="number" min="0" max="120" placeholder="Մին" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
            <span class="text-gray-400">-</span>
            <input type="number" min="0" max="120" placeholder="Մաքս" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold text-gray-500 uppercase">Սեռ</label>
          <select class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option>Բոլորը</option>
            <option>Արական</option>
            <option>Իգական</option>
          </select>
        </div>
        
        <div class="space-y-2">
          <label class="text-xs font-bold text-gray-500 uppercase">Խումբ</label>
          <select class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option>Բոլորը</option>
            <option>Հղիներ</option>
            <option>Քրոնիկ</option>
            <option>Ալյ</option>
          </select>
        </div>
      </div>

      <div class="space-y-4">
        <input type="text" placeholder="Ծանուցման վերնագիր..." class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <textarea rows="4" placeholder="Հաղորդագրության տեքստը..." class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <div class="mt-6 flex justify-end">
        <button class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold text-sm hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
          Ուղարկել Հիմա
        </button>
      </div>
    </section>

  </main>
</div>
    
  </body>
  
</html>
